<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Actualizar URLs · Archivo de Navarra</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #333; }
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    button { padding: 10px 20px; background: #4285f4; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 10px; }
    button:hover { background: #3367d6; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    button.danger { background: #d32f2f; }
    #status { font-weight: bold; margin-bottom: 8px; }
    #log { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 6px; font-family: monospace; font-size: 13px; height: 300px; overflow-y: auto; white-space: pre-wrap; }
    .ok { color: #4ec9b0; }
    .err { color: #f48771; }
    .info { color: #9cdcfe; }
    .warn { color: #dcdcaa; }
    progress { width: 100%; height: 20px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>🏛️ Actualizar URLs del Archivo de Navarra</h1>
  <p style="color:#555;font-size:14px">
    Esta herramienta actualiza los documentos de Firestore que apuntan a <b>navarra.es</b> para que carguen las imágenes locales guardadas en la carpeta <b>/navarra-photos/</b>.
  </p>

  <div class="card">
    <div id="status">No iniciado sesión</div>
    <button id="btnLogin">Entrar con Google</button>
    <button id="btnLogout" style="display:none" class="danger">Cerrar sesión</button>
  </div>

  <div class="card">
    <button id="btnScan" disabled>🔍 Analizar base de datos</button>
    <button id="btnMigrate" disabled>🚀 Iniciar migración a URLs locales</button>
    <progress id="progress" value="0" max="100" style="display:none"></progress>
    <p id="summary" style="font-size:13px;color:#555"></p>
  </div>

  <div class="card">
    <div id="log">Esperando inicio de sesión...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCj2fy9LSRBuPfdAEh-CUMk5T4surT0Vdw",
      authDomain: "project-4938c1eb-c32b-4494-95c.firebaseapp.com",
      projectId: "project-4938c1eb-c32b-4494-95c",
      storageBucket: "project-4938c1eb-c32b-4494-95c.firebasestorage.app",
      messagingSenderId: "1008559277868",
      appId: "1:1008559277868:web:68ccf6b6e7e6ef25738e89"
    };
    const FIRESTORE_DB_ID = "ai-studio-d55aaa70-4a7c-4319-86af-28ede5db32a3";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app, FIRESTORE_DB_ID);

    let currentUser = null;
    let photosToMigrate = [];

    const logEl = document.getElementById("log");
    const btnLogin = document.getElementById("btnLogin");
    const btnLogout = document.getElementById("btnLogout");
    const btnScan = document.getElementById("btnScan");
    const btnMigrate = document.getElementById("btnMigrate");
    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const summaryEl = document.getElementById("summary");

    function addLog(msg, type = "info") {
      const span = document.createElement("span");
      span.className = type;
      span.textContent = msg + "\n";
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        statusEl.textContent = "✅ Sesión: " + user.email;
        btnLogin.style.display = "none";
        btnLogout.style.display = "inline-block";
        btnScan.disabled = false;
        logEl.textContent = "Listo para escanear Firestore.\n";
      } else {
        statusEl.textContent = "No iniciado sesión";
        btnLogin.style.display = "inline-block";
        btnLogout.style.display = "none";
        btnScan.disabled = true;
        btnMigrate.disabled = true;
        logEl.textContent = "Inicia sesión con tu cuenta de administrador para continuar.\n";
      }
    });

    btnLogin.onclick = async () => {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch (e) { addLog("Error login: " + e.message, "err"); }
    };
    btnLogout.onclick = () => signOut(auth);

    btnScan.onclick = async () => {
      addLog("🔍 Escaneando colección 'photos' en Firestore...", "info");
      btnScan.disabled = true;
      photosToMigrate = [];

      try {
        const querySnapshot = await getDocs(collection(db, "photos"));
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const imgUrl = data.imageUrl || "";
          if (imgUrl.includes("navarra.es")) {
            photosToMigrate.push({ id: docSnap.id, title: data.title });
          }
        });

        addLog(`✅ Escaneo completado. Se encontraron ${photosToMigrate.length} fotos con URLs de navarra.es`, "ok");
        summaryEl.textContent = `Se encontraron ${photosToMigrate.length} fotos listas para migración.`;
        
        if (photosToMigrate.length > 0) {
          btnMigrate.disabled = false;
        }
      } catch (e) {
        addLog("❌ Error al escanear base de datos: " + e.message, "err");
      }
      btnScan.disabled = false;
    };

    btnMigrate.onclick = async () => {
      if (!currentUser) return;
      btnScan.disabled = true;
      btnMigrate.disabled = true;
      progressEl.style.display = "block";
      progressEl.value = 0;
      progressEl.max = photosToMigrate.length;

      let updated = 0;
      let errors = 0;

      for (let i = 0; i < photosToMigrate.length; i++) {
        const photo = photosToMigrate[i];
        progressEl.value = i + 1;

        try {
          const localUrl = `/navarra-photos/${photo.id}.jpg`;
          const photoRef = doc(db, "photos", photo.id);
          
          await updateDoc(photoRef, {
            imageUrl: localUrl,
            thumbnailUrl: localUrl,
            updatedAt: serverTimestamp()
          });

          addLog(`✅ [${i+1}/${photosToMigrate.length}] Migrada: "${photo.title || photo.id}" -> ${localUrl}`, "ok");
          updated++;
        } catch (e) {
          addLog(`❌ [${i+1}/${photosToMigrate.length}] Error en ID ${photo.id}: ${e.message}`, "err");
          errors++;
        }

        // Pequeño retardo para no saturar
        await new Promise(r => setTimeout(r, 50));
      }

      summaryEl.textContent = `Completado: ${updated} actualizadas | ${errors} errores.`;
      addLog(`\n🏁 Migración finalizada. Actualizadas: ${updated} | Errores: ${errors}`, "ok");
      btnScan.disabled = false;
    };
  </script>
</body>
</html>
